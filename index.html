<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARMBENCH</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0D1017; }
    canvas#scene3d { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { DragControls } from "three/addons/controls/DragControls.js";

    // ---- CORE ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0D1017);
    const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0.4, 0.4, 0.4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.domElement.id = "scene3d";
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.15, 0);
    scene.add(new THREE.GridHelper(1, 20, 0x4FB8FF, 0x222a35));
    scene.add(new THREE.AxesHelper(0.2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(1,2,1); scene.add(dl);

    // ---- THE ARM ----
    const ARM = [
      { name: "base",     axis: "y", len: 0.06, min: -90,  max: 90,  mass: 0.20 },
      { name: "shoulder", axis: "z", len: 0.10, min: -45,  max: 90,  mass: 0.18 },
      { name: "elbow",    axis: "z", len: 0.09, min: -120, max: 120, mass: 0.12 },
      { name: "wrist",    axis: "z", len: 0.06, min: -90,  max: 90,  mass: 0.08 },
      { name: "gripper",  axis: "y", len: 0.04, min: -90,  max: 90,  mass: 0.06 },
    ];
    const joints = [];
    let parent = scene, parentLen = 0;
    for (const spec of ARM) {
      const joint = new THREE.Group();
      joint.position.y = parentLen; parent.add(joint);
      const link = new THREE.Mesh(new THREE.BoxGeometry(0.03, spec.len, 0.03),
        new THREE.MeshStandardMaterial({ color: 0xFF8A3D }));
      link.position.y = spec.len/2; joint.add(link);
      spec.linkMesh = link;
      joint.add(new THREE.Mesh(new THREE.SphereGeometry(0.018),
        new THREE.MeshStandardMaterial({ color: 0x4FB8FF })));
      joint.userData = spec; spec.target = 0; spec.vel = 0; spec.integ = 0;
      joints.push(joint); parent = joint; parentLen = spec.len;
    }

    // ---- END-EFFECTOR ----
    const lastSpec = ARM[ARM.length-1];
    const endEffector = new THREE.Object3D();
    endEffector.position.y = lastSpec.len;
    joints[joints.length-1].add(endEffector);
    endEffector.add(new THREE.Mesh(new THREE.SphereGeometry(0.012),
      new THREE.MeshStandardMaterial({ color: 0x4ED6A0 })));

    // ---- IK TARGET ----
    const target = new THREE.Mesh(new THREE.SphereGeometry(0.02),
      new THREE.MeshStandardMaterial({ color: 0xFF4D6D }));
    target.position.set(0.12, 0.22, 0.0); scene.add(target);
    const drag = new DragControls([target], camera, renderer.domElement);
    drag.addEventListener("dragstart", () => controls.enabled = false);
    drag.addEventListener("dragend",   () => controls.enabled = true);

    // ---- CCD IK ----
    const IK = { enabled: false, iterations: 10, tolerance: 0.003 };
    const _p=new THREE.Vector3(),_tip=new THREE.Vector3(),_tgt=new THREE.Vector3();
    const _axis=new THREE.Vector3(),_toTip=new THREE.Vector3(),_toTgt=new THREE.Vector3();
    const _cross=new THREE.Vector3(),_q=new THREE.Quaternion();
    const localAxis=(l)=>l==="y"?new THREE.Vector3(0,1,0):new THREE.Vector3(0,0,1);
    function solveIK() {
      const saved = joints.map(j=>j.rotation[j.userData.axis]);
      target.getWorldPosition(_tgt);
      for (let it=0; it<IK.iterations; it++) {
        let done=false;
        for (let i=joints.length-1;i>=0;i--){
          const joint=joints[i],spec=joint.userData,letter=spec.axis;
          endEffector.getWorldPosition(_tip);
          if(_tip.distanceTo(_tgt)<IK.tolerance){done=true;break;}
          joint.getWorldPosition(_p); joint.getWorldQuaternion(_q);
          _axis.copy(localAxis(letter)).applyQuaternion(_q).normalize();
          _toTip.copy(_tip).sub(_p); _toTgt.copy(_tgt).sub(_p);
          _toTip.addScaledVector(_axis,-_toTip.dot(_axis));
          _toTgt.addScaledVector(_axis,-_toTgt.dot(_axis));
          if(_toTip.lengthSq()<1e-8||_toTgt.lengthSq()<1e-8) continue;
          _toTip.normalize(); _toTgt.normalize();
          _cross.crossVectors(_toTip,_toTgt);
          const ang=Math.atan2(_cross.dot(_axis),_toTip.dot(_toTgt));
          joint.rotation[letter]+=ang;
          let d=THREE.MathUtils.radToDeg(joint.rotation[letter]);
          d=Math.max(spec.min,Math.min(spec.max,d));
          joint.rotation[letter]=THREE.MathUtils.degToRad(d);
          joint.updateMatrixWorld(true);
        }
        if(done)break;
      }
      joints.forEach((j,i)=>{ j.userData.target=j.rotation[j.userData.axis];
        j.rotation[j.userData.axis]=saved[i]; });
      scene.updateMatrixWorld(true);
    }

    // ---- PID ----
    const PID = { kp:120, ki:0, kd:8, iClamp:40 };

    // ---- GRAVITY TORQUE (quasi-static model) ----
    const GRAV = { g:9.81, scale:0.0 };
    const _jp=new THREE.Vector3(),_cm=new THREE.Vector3();
    function gravityTorque(idx) {
      const joint=joints[idx], spec=joint.userData;
      if (spec.axis==="y") return 0;
      joint.getWorldPosition(_jp);
      let torque=0;
      for (let k=idx;k<joints.length;k++){
        const ls=joints[k].userData;
        const weight=ls.mass*GRAV.g*GRAV.scale;
        joints[k].localToWorld(_cm.set(0, ls.len/2, 0));
        const dx=_cm.x-_jp.x, dz=_cm.z-_jp.z;
        const lever=Math.sqrt(dx*dx+dz*dz)*Math.sign(dx||1);
        torque += -weight*lever;
      }
      return torque;
    }

    function stepPhysics(dt) {
      for (let i=0;i<joints.length;i++){
        const joint=joints[i], s=joint.userData;
        const cur=joint.rotation[s.axis];
        const e=s.target-cur;
        s.integ+=e*dt; s.integ=Math.max(-PID.iClamp,Math.min(PID.iClamp,s.integ));
        const control=PID.kp*e+PID.ki*s.integ-PID.kd*s.vel;
        const gravAcc=gravityTorque(i)/s.mass;
        s.vel+=(control+gravAcc)*dt;
        let next=cur+s.vel*dt;
        let deg=THREE.MathUtils.radToDeg(next);
        if(deg<s.min){deg=s.min;s.vel=0;}
        if(deg>s.max){deg=s.max;s.vel=0;}
        joint.rotation[s.axis]=THREE.MathUtils.degToRad(deg);
      }
    }
    let _last=performance.now(), _acc=0; const PHYS_DT=1/120;

    // ---- COLLISION DETECTION (capsule model) ----
    const COLL = { block:true, ground:false, self:false };
    const LINK_R = 0.016;
    const clamp01 = (v)=>Math.max(0,Math.min(1,v));
    function segSegDist(p1,q1,p2,q2){
      const d1=q1.clone().sub(p1), d2=q2.clone().sub(p2), r=p1.clone().sub(p2);
      const a=d1.dot(d1), e=d2.dot(d2), f=d2.dot(r); let s,t;
      if(a<=1e-9&&e<=1e-9) return r.length();
      if(a<=1e-9){ s=0; t=clamp01(f/e); }
      else{ const c=d1.dot(r);
        if(e<=1e-9){ t=0; s=clamp01(-c/a); }
        else{ const b=d1.dot(d2), den=a*e-b*b;
          s=den>1e-9?clamp01((b*f-c*e)/den):0;
          t=(b*s+f)/e;
          if(t<0){t=0;s=clamp01(-c/a);} else if(t>1){t=1;s=clamp01((b-c)/a);} } }
      const c1=p1.clone().add(d1.multiplyScalar(s));
      const c2=p2.clone().add(d2.multiplyScalar(t));
      return c1.distanceTo(c2);
    }
    function checkCollisions(){
      scene.updateMatrixWorld(true);
      const pts=joints.map(j=>j.getWorldPosition(new THREE.Vector3()));
      const eff=endEffector.getWorldPosition(new THREE.Vector3());
      const seg=[];
      for(let i=0;i<joints.length;i++) seg.push([pts[i], i<joints.length-1?pts[i+1]:eff]);
      const hit=new Array(joints.length).fill(false);
      let ground=false, self=false;
      for(let i=1;i<seg.length;i++){
        if(Math.min(seg[i][0].y,seg[i][1].y)-LINK_R<0){ hit[i]=true; ground=true; }
      }
      for(let i=0;i<seg.length;i++) for(let k=i+2;k<seg.length;k++){
        if(segSegDist(seg[i][0],seg[i][1],seg[k][0],seg[k][1])<LINK_R*2){ hit[i]=hit[k]=true; self=true; }
      }
      return {hit, ground, self, any:ground||self};
    }

    // ---- TRAJECTORY PLANNING (trapezoidal time-scaling) ----
    function sOfTau(tau, a){
      a = Math.min(0.5, Math.max(0.01, a));
      const v = 1/(1-a);
      if (tau < a)      return v*tau*tau/(2*a);
      if (tau < 1-a)    return v*(tau - a/2);
      const td = 1-tau; return 1 - v*td*td/(2*a);
    }
    const TRAJ = { active:false, loop:false, t:0, T:1, a:0.3, vmax:60, from:null, to:null, goingTo:"B" };
    let poseA=null, poseB=null;
    const curActualDeg = () => joints.map(j=>THREE.MathUtils.radToDeg(j.rotation[j.userData.axis]));
    const curTargetDeg = () => joints.map(j=>THREE.MathUtils.radToDeg(j.userData.target));
    function startLeg(toArr){
      TRAJ.from = curTargetDeg();
      TRAJ.to = toArr.slice();
      let maxMove=0;
      for(let i=0;i<joints.length;i++) maxMove=Math.max(maxMove, Math.abs(TRAJ.to[i]-TRAJ.from[i]));
      TRAJ.T = Math.max(0.4, maxMove / TRAJ.vmax);
      TRAJ.t = 0; TRAJ.active = true;
    }

    // ---- CONTROL METRICS (step response + tracking) ----
    let simT = 0;
    const MET = joints.map(()=>({ lastTgt:0, idle:true, startAct:0, finalTgt:0, t0:0,
      lastChange:-1, lastOut:0, peak:0, t10:null, t90:null, still:null, res:null }));
    function tickMetrics(dt){
      simT += dt;
      joints.forEach((j,i)=>{
        const s=j.userData, m=MET[i];
        const tgt=THREE.MathUtils.radToDeg(s.target);
        const act=THREE.MathUtils.radToDeg(j.rotation[s.axis]);

        if(Math.abs(tgt-m.lastTgt)>0.05){                  // target moved → (new) move
          if(m.idle){ m.idle=false; m.startAct=act; m.t0=simT; m.peak=0; m.t10=null; m.t90=null; }
          m.lastChange=simT; m.finalTgt=tgt; m.lastTgt=tgt; m.lastOut=simT;
        }
        if(m.idle) return;

        const step=m.finalTgt-m.startAct;
        if(Math.abs(step)<0.5){ m.idle=true; return; }     // too small to measure
        const dir=Math.sign(step), prog=(act-m.startAct)/step;
        if(m.t10===null && prog>=0.1) m.t10=simT;
        if(m.t90===null && prog>=0.9) m.t90=simT;
        m.peak=Math.max(m.peak,(act-m.finalTgt)*dir);      // how far past the target
        const band=Math.max(0.02*Math.abs(step),0.5);      // ±2% settling band
        const inBand=Math.abs(act-m.finalTgt)<=band;
        if(!inBand) m.lastOut=simT;

        if(Math.abs(s.vel)<0.03){ if(m.still===null) m.still=simT; } else m.still=null;
        if(simT-m.lastChange>0.3 && m.still!==null && simT-m.still>0.5){   // motion has stopped
          m.idle=true;
          m.res={ step, band,
            overshoot: Math.max(0,m.peak)/Math.abs(step)*100,
            rise: (m.t10!==null&&m.t90!==null) ? m.t90-m.t10 : null,
            settle: inBand ? m.lastOut-m.t0 : null };
        }
      });
    }

    // ---- PLOT ----
    const plotJoint={index:1}; const BUF=400;
    const hist=joints.map(()=>({act:new Array(BUF).fill(null),tgt:new Array(BUF).fill(null)}));
        // ---- RIGHT DOCK: chart + metrics (collapsible, resizable) ----
    const PLOT_SIZE={ w:Math.min(460, Math.round(innerWidth*0.42)), h:200 };
    const rightWrap=document.createElement("div");
    rightWrap.style.cssText="position:fixed;top:12px;right:12px;z-index:10;display:flex;flex-direction:column;"+
      "max-height:calc(100vh - 24px);background:rgba(10,13,19,0.92);border:1px solid rgba(231,236,243,0.16);"+
      "border-radius:10px;font-family:monospace;color:#E7ECF3;";
    document.body.appendChild(rightWrap);

    const rightHead=document.createElement("button");
    rightHead.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:16px;"+
      "padding:8px 14px;background:transparent;border:none;color:#93A2B4;font-family:monospace;"+
      "font-size:12px;cursor:pointer;text-align:left;";
    rightHead.innerHTML="<span>CHART & METRICS</span><span id='right-chev'>▾</span>";
    rightWrap.appendChild(rightHead);

    const rightBody=document.createElement("div");
    rightBody.style.cssText="overflow:auto;border-top:1px solid rgba(231,236,243,0.12);";
    rightWrap.appendChild(rightBody);

    const plot=document.createElement("canvas");
    plot.style.display="block";
    rightBody.appendChild(plot); const ctx=plot.getContext("2d");
    function sizePlot(){                              // crisp on retina screens
      const dpr=devicePixelRatio||1;
      plot.width=Math.round(PLOT_SIZE.w*dpr); plot.height=Math.round(PLOT_SIZE.h*dpr);
      plot.style.width=PLOT_SIZE.w+"px"; plot.style.height=PLOT_SIZE.h+"px";
      rightBody.style.width=PLOT_SIZE.w+"px";
    }
    sizePlot();

    // resize grip, bottom-left corner: drag left/down = bigger, right/up = smaller
     const grip=document.createElement("div");
    grip.title="drag to resize";
    grip.style.cssText="position:absolute;left:0;bottom:0;width:16px;height:16px;cursor:nesw-resize;"+
      "border-left:2px solid #4FB8FF;border-bottom:2px solid #4FB8FF;border-bottom-left-radius:10px;opacity:0.75;";
    rightWrap.appendChild(grip);
    grip.addEventListener("pointerdown",(e)=>{
      e.preventDefault(); grip.setPointerCapture(e.pointerId);
      const sx=e.clientX, sy=e.clientY, sw=PLOT_SIZE.w, sh=PLOT_SIZE.h;
      const move=(ev)=>{
        PLOT_SIZE.w=Math.max(220, Math.min(innerWidth-40, sw-(ev.clientX-sx)));
        PLOT_SIZE.h=Math.max(90,  Math.min(innerHeight*0.7, sh+(ev.clientY-sy)));
        sizePlot();
      };
      const up=()=>{ grip.removeEventListener("pointermove",move); grip.removeEventListener("pointerup",up); };
      grip.addEventListener("pointermove",move); grip.addEventListener("pointerup",up);
    });

    rightHead.onclick=()=>{
      const hid=rightBody.style.display==="none";
      rightBody.style.display=hid?"":"none"; grip.style.display=hid?"":"none";
      document.getElementById("right-chev").textContent=hid?"▾":"▸";
    };
    function pushSample(){ joints.forEach((j,i)=>{ const s=j.userData,h=hist[i];
      h.act.push(THREE.MathUtils.radToDeg(j.rotation[s.axis])); h.act.shift();
      h.tgt.push(THREE.MathUtils.radToDeg(s.target)); h.tgt.shift(); }); }
    function drawPlot(){
      const i=plotJoint.index,s=joints[i].userData,h=hist[i],m=MET[i];
            const W=PLOT_SIZE.w,H=PLOT_SIZE.h,pad=24;
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      ctx.clearRect(0,0,W,H);
      const y=(deg)=>(H-pad)-(deg-s.min)/(s.max-s.min)*(H-2*pad);
      const x=(k)=>pad+k/(BUF-1)*(W-pad-8);
      ctx.strokeStyle="rgba(231,236,243,0.12)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(pad,y(0)); ctx.lineTo(W-8,y(0)); ctx.stroke();

      // ±2% settling band around the final target (dashed)
      const step=m.finalTgt-m.startAct;
      if(m.lastChange>=0 && Math.abs(step)>=0.5){
        const band=Math.max(0.02*Math.abs(step),0.5);
        ctx.strokeStyle="rgba(255,77,109,0.35)"; ctx.setLineDash([4,4]);
        [m.finalTgt+band, m.finalTgt-band].forEach(v=>{
          ctx.beginPath(); ctx.moveTo(pad,y(v)); ctx.lineTo(W-8,y(v)); ctx.stroke(); });
        ctx.setLineDash([]);
      }

      ctx.strokeStyle="#FF4D6D"; ctx.lineWidth=1; ctx.beginPath(); let st=false;
      h.tgt.forEach((v,k)=>{ if(v==null)return; const px=x(k),py=y(v);
        st?ctx.lineTo(px,py):(ctx.moveTo(px,py),st=true); }); ctx.stroke();
      ctx.strokeStyle="#4ED6A0"; ctx.lineWidth=1.5; ctx.beginPath(); st=false;
      h.act.forEach((v,k)=>{ if(v==null)return; const px=x(k),py=y(v);
        st?ctx.lineTo(px,py):(ctx.moveTo(px,py),st=true); }); ctx.stroke();
      ctx.fillStyle="#93A2B4"; ctx.font="11px monospace";
      ctx.fillText(`${s.name}  (target ─ red, actual ─ green, ±2% band ┄)`,pad,14);
      ctx.fillText(`${s.max}°`,2,y(s.max)+4); ctx.fillText(`${s.min}°`,2,y(s.min)+4);
    }

    // ---- METRICS PANEL (under the plot) ----
      const metBox=document.createElement("div");
    metBox.style.cssText="box-sizing:border-box;padding:10px 14px 16px;border-top:1px solid rgba(231,236,243,0.12);"+
      "font-family:monospace;font-size:12px;color:#E7ECF3;";
    rightBody.appendChild(metBox);
    function updateMetrics(){
      const i=plotJoint.index, j=joints[i], s=j.userData, m=MET[i], h=hist[i], r=m.res;
      let n=0,sum=0,mx=0;
      for(let k=0;k<BUF;k++){ const a=h.act[k],t=h.tgt[k]; if(a==null||t==null) continue;
        const e=a-t; sum+=e*e; mx=Math.max(mx,Math.abs(e)); n++; }
      const rms=n?Math.sqrt(sum/n):0;
      const ess=Math.abs(THREE.MathUtils.radToDeg(s.target-j.rotation[s.axis]));
      const f=(v,u,d=2)=>v==null?"—":v.toFixed(d)+u;
      const state=!m.idle?"<span style='color:#FF8A3D'>moving…</span>"
                 :(r?"<span style='color:#4ED6A0'>settled</span>":"<span style='color:#93A2B4'>idle</span>");
      const row=(k,v)=>`<div style='display:flex;justify-content:space-between;'><span style='color:#93A2B4'>${k}</span><span>${v}</span></div>`;
      metBox.innerHTML=
        `<div style='display:flex;justify-content:space-between;margin-bottom:6px;'>`+
          `<span style='color:#4FB8FF'>${s.name} · step response</span>${state}</div>`+
        `<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:3px 22px;'>`+
          row("step size", r?f(r.step,"°",1):"—")+
          row("overshoot", r?f(r.overshoot,"%",1):"—")+
          row("rise time 10–90%", r?f(r.rise,"s"):"—")+
          row("settling ±2%", r?(r.settle==null?"never in band":f(r.settle,"s")):"—")+
          row("steady-state err", m.idle?f(ess,"°"):"—")+
          row("RMS tracking err", f(rms,"°"))+
          row("max tracking err", f(mx,"°"))+
          row("window", (BUF*PHYS_DT).toFixed(1)+"s")+
        `</div>`;
    }
    setInterval(updateMetrics, 100);

    // ---- PANEL ----
        // outer wrapper (fixed, holds the header + collapsible body)
    const panelWrap=document.createElement("div");
    panelWrap.style.cssText="position:fixed;top:12px;left:12px;max-height:92vh;display:flex;flex-direction:column;"+
      "background:rgba(22,27,36,0.9);border:1px solid rgba(231,236,243,0.16);border-radius:10px;"+
      "font-family:monospace;color:#E7ECF3;font-size:13px;z-index:10;";
    document.body.appendChild(panelWrap);

    // clickable header
    const panelHead=document.createElement("button");
    panelHead.style.cssText="display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;"+
      "padding:8px 14px;background:transparent;border:none;color:#93A2B4;font-family:monospace;"+
      "font-size:12px;cursor:pointer;text-align:left;";
    panelHead.innerHTML="<span>CONTROLS</span><span id='panel-chev'>▾</span>";
    panelWrap.appendChild(panelHead);

    // the body — everything below still appends to `panel`
    const panel=document.createElement("div");
    panel.style.cssText="padding:4px 14px 12px;overflow:auto;border-top:1px solid rgba(231,236,243,0.12);";
    panelWrap.appendChild(panel);

    panelHead.onclick=()=>{
      const hidden=panel.style.display==="none";
      panel.style.display=hidden?"":"none";
      document.getElementById("panel-chev").textContent=hidden?"▾":"▸";
    };

    const ikRow=document.createElement("label");
    ikRow.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px;color:#FF4D6D;cursor:pointer;";
    const ikBox=document.createElement("input"); ikBox.type="checkbox";
    ikBox.addEventListener("change",()=>IK.enabled=ikBox.checked);
    ikRow.appendChild(ikBox); ikRow.appendChild(document.createTextNode("Solve to target (IK)"));
    panel.appendChild(ikRow);

    const pickRow=document.createElement("div"); pickRow.style.cssText="margin:2px 0 8px;color:#4ED6A0;";
    pickRow.appendChild(document.createTextNode("plot joint: "));
    const picker=document.createElement("select");
    joints.forEach((j,i)=>{ const o=document.createElement("option");
      o.value=i;o.textContent=j.userData.name; if(i===plotJoint.index)o.selected=true; picker.appendChild(o); });
    picker.addEventListener("change",()=>plotJoint.index=+picker.value);
    pickRow.appendChild(picker); panel.appendChild(pickRow);

    function section(title){ const d=document.createElement("div");
      d.style.cssText="margin:4px 0 10px;padding:8px 0;border-top:1px solid rgba(231,236,243,0.12);";
      const h=document.createElement("div"); h.textContent=title; h.style.cssText="color:#93A2B4;font-size:11px;margin-bottom:6px;";
      d.appendChild(h); panel.appendChild(d); return d; }
    function ctrlSlider(host,name,obj,key,min,max,step,color){
      const row=document.createElement("div"); row.style.margin="5px 0";
      const label=document.createElement("div"); label.style.color=color||"#4FB8FF";
      label.textContent=`${name}: ${obj[key]}`;
      const sl=document.createElement("input"); sl.type="range"; sl.min=min; sl.max=max; sl.step=step;
      sl.value=obj[key]; sl.style.width="180px";
      sl.addEventListener("input",()=>{ obj[key]=+sl.value; label.textContent=`${name}: ${obj[key]}`;
        if(key==="ki") joints.forEach(j=>j.userData.integ=0); });
      row.appendChild(label); row.appendChild(sl); host.appendChild(row);
    }

    const ctrlSec=section("PID + GRAVITY");
    ctrlSlider(ctrlSec,"Kp",PID,"kp",0,400,1);
    ctrlSlider(ctrlSec,"Ki",PID,"ki",0,200,1);
    ctrlSlider(ctrlSec,"Kd",PID,"kd",0,60,0.5);
    ctrlSlider(ctrlSec,"Gravity",GRAV,"scale",0,1,0.05,"#FF8A3D");

    // --- collision controls ---
    const collSec=section("COLLISION");
    const collRow=document.createElement("label");
    collRow.style.cssText="display:flex;gap:8px;align-items:center;color:#FF4D6D;cursor:pointer;";
    const collBox=document.createElement("input"); collBox.type="checkbox"; collBox.checked=true;
    collBox.addEventListener("change",()=>COLL.block=collBox.checked);
    collRow.appendChild(collBox); collRow.appendChild(document.createTextNode("block collisions"));
    collSec.appendChild(collRow);
    const collStatus=document.createElement("div");
    collStatus.style.cssText="color:#93A2B4;font-size:11px;margin-top:6px;"; collSec.appendChild(collStatus);
    setInterval(()=>{ collStatus.textContent =
      (COLL.ground||COLL.self) ? "contact: "+[COLL.ground?"ground":null,COLL.self?"self":null].filter(Boolean).join(" + ") : "no contact"; }, 100);

    // --- trajectory controls ---
    const trajSec=section("TRAJECTORY  (A → B)");
    const btnRow=document.createElement("div"); btnRow.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;";
    function mkBtn(txt,color){ const b=document.createElement("button");
      b.textContent=txt; b.style.cssText=`font-family:monospace;font-size:11px;color:${color};`+
      "background:transparent;border:1px solid rgba(231,236,243,0.18);border-radius:6px;padding:5px 9px;cursor:pointer;";
      return b; }
    const capA=mkBtn("Capture A","#4FB8FF"), capB=mkBtn("Capture B","#4FB8FF"), play=mkBtn("Play A→B","#4ED6A0");
    btnRow.appendChild(capA); btnRow.appendChild(capB); btnRow.appendChild(play); trajSec.appendChild(btnRow);

    const loopRow=document.createElement("label");
    loopRow.style.cssText="display:flex;gap:8px;align-items:center;margin:4px 0 8px;color:#93A2B4;cursor:pointer;font-size:12px;";
    const loopBox=document.createElement("input"); loopBox.type="checkbox";
    loopBox.addEventListener("change",()=>TRAJ.loop=loopBox.checked);
    loopRow.appendChild(loopBox); loopRow.appendChild(document.createTextNode("loop A↔B")); trajSec.appendChild(loopRow);

    ctrlSlider(trajSec,"Max speed °/s",TRAJ,"vmax",10,180,5,"#4ED6A0");
    ctrlSlider(trajSec,"Smoothness",TRAJ,"a",0.05,0.5,0.05,"#4ED6A0");
    const trajStatus=document.createElement("div");
    trajStatus.style.cssText="color:#93A2B4;font-size:11px;margin-top:4px;"; trajStatus.textContent="A: — , B: —";
    trajSec.appendChild(trajStatus);

    function updTrajStatus(){ trajStatus.textContent=`A: ${poseA?"set":"—"} , B: ${poseB?"set":"—"}` +
      (TRAJ.active?`  ·  moving (T=${TRAJ.T.toFixed(2)}s)`:""); }
    capA.onclick=()=>{ poseA=curActualDeg(); updTrajStatus(); };
    capB.onclick=()=>{ poseB=curActualDeg(); updTrajStatus(); };
    play.onclick=()=>{
      if(TRAJ.active){ TRAJ.active=false; play.textContent="Play A→B"; updTrajStatus(); return; }
      if(!poseA||!poseB){ trajStatus.textContent="capture A and B first"; return; }
      IK.enabled=false; ikBox.checked=false;
      TRAJ.goingTo="B"; startLeg(poseB); play.textContent="Stop"; updTrajStatus();
    };

    // --- per-joint command sliders ---
    const jointUI=[];
    joints.forEach((joint)=>{
      const spec=joint.userData;
      const row=document.createElement("div"); row.style.margin="6px 0";
      const label=document.createElement("div"); label.textContent=`${spec.name}: 0°`; label.style.color="#FF8A3D";
      const sl=document.createElement("input"); sl.type="range"; sl.min=spec.min; sl.max=spec.max;
      sl.value=0; sl.style.width="180px";
      sl.addEventListener("input",()=>{ if(IK.enabled||TRAJ.active)return;
        const deg=+sl.value; spec.target=THREE.MathUtils.degToRad(deg); label.textContent=`${spec.name}: ${deg}° (cmd)`; });
      row.appendChild(label); row.appendChild(sl); panel.appendChild(row);
      jointUI.push({sl,label,joint,spec});
    });
    function syncSliders(){ jointUI.forEach(({sl,label,joint,spec})=>{
      const deg=Math.round(THREE.MathUtils.radToDeg(joint.rotation[spec.axis]));
      sl.value=deg; label.textContent=`${spec.name}: ${deg}°`; }); }

    // ---- READOUT ----
    const readout=document.createElement("div");
    readout.style.cssText="position:fixed;bottom:12px;left:12px;padding:10px 14px;"+
      "background:rgba(22,27,36,0.9);border:1px solid rgba(231,236,243,0.16);border-radius:10px;"+
      "font-family:monospace;color:#4ED6A0;font-size:13px;z-index:10;";
    document.body.appendChild(readout);
    const tipPos=new THREE.Vector3(),tgtPos=new THREE.Vector3();
    function updateReadout(){
      endEffector.getWorldPosition(tipPos); target.getWorldPosition(tgtPos);
      const dist=tipPos.distanceTo(tgtPos);
      const reach=dist<0.01?"reached":(IK.enabled?"out of reach":"—");
      readout.textContent=`tip x:${tipPos.x.toFixed(3)} y:${tipPos.y.toFixed(3)} z:${tipPos.z.toFixed(3)}   dist:${dist.toFixed(3)}  ${reach}`;
    }

    // ---- LOOP ----
    function animate(){
      requestAnimationFrame(animate);
      controls.update();
      const now=performance.now();
      const frameDt=Math.min((now-_last)/1000,0.05);
      _acc+=frameDt; _last=now;

      if(TRAJ.active){
        TRAJ.t+=frameDt;
        const tau=Math.min(TRAJ.t/TRAJ.T,1);
        const s=sOfTau(tau,TRAJ.a);
        for(let i=0;i<joints.length;i++){
          const deg=TRAJ.from[i]+(TRAJ.to[i]-TRAJ.from[i])*s;
          joints[i].userData.target=THREE.MathUtils.degToRad(deg);
        }
        if(tau>=1){
          if(TRAJ.loop){ TRAJ.goingTo=TRAJ.goingTo==="B"?"A":"B"; startLeg(TRAJ.goingTo==="B"?poseB:poseA); }
          else { TRAJ.active=false; play.textContent="Play A→B"; }
          updTrajStatus();
        }
      }

      if(IK.enabled && !TRAJ.active) solveIK();
      const safe = joints.map(j=>j.rotation[j.userData.axis]);
      while(_acc>=PHYS_DT){ stepPhysics(PHYS_DT); pushSample(); tickMetrics(PHYS_DT); _acc-=PHYS_DT; }
      const col = checkCollisions();
      COLL.ground=col.ground; COLL.self=col.self;
      if(col.any && COLL.block){
        joints.forEach((j,i)=>{ j.rotation[j.userData.axis]=safe[i]; j.userData.vel=0; });
        scene.updateMatrixWorld(true);
      }
      joints.forEach((j,i)=>{ const m=j.userData.linkMesh; if(m)
        m.material.color.setHex(col.hit[i]?0xFF4D6D:0xFF8A3D); });
      if(IK.enabled || TRAJ.active) syncSliders();

      drawPlot(); updateReadout();
      renderer.render(scene,camera);
    }
    animate();
    addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  </script>
</body>
</html>
