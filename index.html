<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARMBENCH</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0D1017; }
    canvas#scene3d { display: block; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { DragControls } from "three/addons/controls/DragControls.js";

    // ---- CORE ----
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0D1017);

    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.01, 100
    );
    camera.position.set(0.4, 0.4, 0.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.domElement.id = "scene3d";
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.15, 0);

    scene.add(new THREE.GridHelper(1, 20, 0x4FB8FF, 0x222a35));
    scene.add(new THREE.AxesHelper(0.2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    // ---- THE ARM ----
    const ARM = [
      { name: "base",     axis: "y", len: 0.06, min: -90,  max: 90  },
      { name: "shoulder", axis: "z", len: 0.10, min: -45,  max: 90  },
      { name: "elbow",    axis: "z", len: 0.09, min: -120, max: 120 },
      { name: "wrist",    axis: "z", len: 0.06, min: -90,  max: 90  },
      { name: "gripper",  axis: "y", len: 0.04, min: -90,  max: 90  },
    ];

    const joints = [];
    let parent = scene;
    let parentLen = 0;

    for (const spec of ARM) {
      const joint = new THREE.Group();
      joint.position.y = parentLen;
      parent.add(joint);

      const link = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, spec.len, 0.03),
        new THREE.MeshStandardMaterial({ color: 0xFF8A3D })
      );
      link.position.y = spec.len / 2;
      joint.add(link);

      joint.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.018),
        new THREE.MeshStandardMaterial({ color: 0x4FB8FF })
      ));

      joint.userData = spec;
      spec.target = 0;
      spec.vel = 0;
      spec.integ = 0;
      joints.push(joint);
      parent = joint;
      parentLen = spec.len;
    }

    // ---- END-EFFECTOR ----
    const lastSpec = ARM[ARM.length - 1];
    const endEffector = new THREE.Object3D();
    endEffector.position.y = lastSpec.len;
    joints[joints.length - 1].add(endEffector);
    endEffector.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.012),
      new THREE.MeshStandardMaterial({ color: 0x4ED6A0 })
    ));

    // ---- IK TARGET ----
    const target = new THREE.Mesh(
      new THREE.SphereGeometry(0.02),
      new THREE.MeshStandardMaterial({ color: 0xFF4D6D })
    );
    target.position.set(0.12, 0.22, 0.0);
    scene.add(target);

    const drag = new DragControls([target], camera, renderer.domElement);
    drag.addEventListener("dragstart", () => (controls.enabled = false));
    drag.addEventListener("dragend",   () => (controls.enabled = true));

    // ---- CCD IK ----
    const IK = { enabled: false, iterations: 10, tolerance: 0.003 };
    const _p = new THREE.Vector3(), _tip = new THREE.Vector3(), _tgt = new THREE.Vector3();
    const _axis = new THREE.Vector3(), _toTip = new THREE.Vector3(), _toTgt = new THREE.Vector3();
    const _cross = new THREE.Vector3(), _q = new THREE.Quaternion();
    const localAxis = (l) => l === "y" ? new THREE.Vector3(0,1,0) : new THREE.Vector3(0,0,1);

    function solveIK() {
      const saved = joints.map(j => j.rotation[j.userData.axis]);
      target.getWorldPosition(_tgt);
      for (let iter = 0; iter < IK.iterations; iter++) {
        let done = false;
        for (let i = joints.length - 1; i >= 0; i--) {
          const joint = joints[i], spec = joint.userData, letter = spec.axis;
          endEffector.getWorldPosition(_tip);
          if (_tip.distanceTo(_tgt) < IK.tolerance) { done = true; break; }
          joint.getWorldPosition(_p);
          joint.getWorldQuaternion(_q);
          _axis.copy(localAxis(letter)).applyQuaternion(_q).normalize();
          _toTip.copy(_tip).sub(_p); _toTgt.copy(_tgt).sub(_p);
          _toTip.addScaledVector(_axis, -_toTip.dot(_axis));
          _toTgt.addScaledVector(_axis, -_toTgt.dot(_axis));
          if (_toTip.lengthSq() < 1e-8 || _toTgt.lengthSq() < 1e-8) continue;
          _toTip.normalize(); _toTgt.normalize();
          _cross.crossVectors(_toTip, _toTgt);
          const angle = Math.atan2(_cross.dot(_axis), _toTip.dot(_toTgt));
          joint.rotation[letter] += angle;
          let deg = THREE.MathUtils.radToDeg(joint.rotation[letter]);
          deg = Math.max(spec.min, Math.min(spec.max, deg));
          joint.rotation[letter] = THREE.MathUtils.degToRad(deg);
          joint.updateMatrixWorld(true);
        }
        if (done) break;
      }
      joints.forEach((j, i) => {
        j.userData.target = j.rotation[j.userData.axis];
        j.rotation[j.userData.axis] = saved[i];
      });
      scene.updateMatrixWorld(true);
    }

    // ---- PID ----
    const PID = { kp: 120, ki: 0, kd: 8, iClamp: 40 };
    function stepPhysics(dt) {
      for (const joint of joints) {
        const s = joint.userData;
        const cur = joint.rotation[s.axis];
        const e = s.target - cur;
        s.integ += e * dt;
        s.integ = Math.max(-PID.iClamp, Math.min(PID.iClamp, s.integ));
        const u = PID.kp * e + PID.ki * s.integ - PID.kd * s.vel;
        s.vel += u * dt;
        let next = cur + s.vel * dt;
        let deg = THREE.MathUtils.radToDeg(next);
        if (deg < s.min) { deg = s.min; s.vel = 0; }
        if (deg > s.max) { deg = s.max; s.vel = 0; }
        joint.rotation[s.axis] = THREE.MathUtils.degToRad(deg);
      }
    }

    let _last = performance.now(), _acc = 0;
    const PHYS_DT = 1 / 120;

    // ---- RESPONSE PLOT (P3 step 3) ----
    const plotJoint = { index: 1 };                 // which joint to graph (default: shoulder)
    const BUF = 400;                                // samples kept on screen
    const hist = joints.map(() => ({ act: new Array(BUF).fill(null), tgt: new Array(BUF).fill(null) }));

    const plot = document.createElement("canvas");
    plot.width = 460; plot.height = 200;
    plot.style.cssText =
      "position:fixed;top:12px;right:12px;background:rgba(10,13,19,0.92);" +
      "border:1px solid rgba(231,236,243,0.16);border-radius:10px;z-index:10;";
    document.body.appendChild(plot);
    const ctx = plot.getContext("2d");

    function pushSample() {
      joints.forEach((j, i) => {
        const s = j.userData;
        const h = hist[i];
        h.act.push(THREE.MathUtils.radToDeg(j.rotation[s.axis])); h.act.shift();
        h.tgt.push(THREE.MathUtils.radToDeg(s.target));          h.tgt.shift();
      });
    }

    function drawPlot() {
      const i = plotJoint.index, s = joints[i].userData, h = hist[i];
      const W = plot.width, H = plot.height, pad = 24;
      ctx.clearRect(0, 0, W, H);

      // y maps [min,max] -> [H-pad, pad]
      const y = (deg) => (H - pad) - (deg - s.min) / (s.max - s.min) * (H - 2 * pad);
      const x = (k) => pad + k / (BUF - 1) * (W - pad - 8);

      // zero line
      ctx.strokeStyle = "rgba(231,236,243,0.12)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad, y(0)); ctx.lineTo(W - 8, y(0)); ctx.stroke();

      // target line (flat, red)
      ctx.strokeStyle = "#FF4D6D"; ctx.beginPath();
      let started = false;
      h.tgt.forEach((v, k) => { if (v == null) return;
        const px = x(k), py = y(v);
        started ? ctx.lineTo(px, py) : (ctx.moveTo(px, py), started = true); });
      ctx.stroke();

      // actual line (green)
      ctx.strokeStyle = "#4ED6A0"; ctx.lineWidth = 1.5; ctx.beginPath();
      started = false;
      h.act.forEach((v, k) => { if (v == null) return;
        const px = x(k), py = y(v);
        started ? ctx.lineTo(px, py) : (ctx.moveTo(px, py), started = true); });
      ctx.stroke();

      // labels
      ctx.fillStyle = "#93A2B4"; ctx.font = "11px monospace";
      ctx.fillText(`${s.name}  (target ─ red, actual ─ green)`, pad, 14);
      ctx.fillText(`${s.max}°`, 2, y(s.max) + 4);
      ctx.fillText(`${s.min}°`, 2, y(s.min) + 4);
    }

    // ---- CONTROLS PANEL ----
    const panel = document.createElement("div");
    panel.style.cssText =
      "position:fixed;top:12px;left:12px;padding:12px 14px;max-height:92vh;overflow:auto;" +
      "background:rgba(22,27,36,0.9);border:1px solid rgba(231,236,243,0.16);" +
      "border-radius:10px;font-family:monospace;color:#E7ECF3;font-size:13px;z-index:10;";
    document.body.appendChild(panel);

    const ikRow = document.createElement("label");
    ikRow.style.cssText = "display:flex;gap:8px;align-items:center;margin-bottom:8px;color:#FF4D6D;cursor:pointer;";
    const ikBox = document.createElement("input");
    ikBox.type = "checkbox";
    ikBox.addEventListener("change", () => (IK.enabled = ikBox.checked));
    ikRow.appendChild(ikBox);
    ikRow.appendChild(document.createTextNode("Solve to target (IK)"));
    panel.appendChild(ikRow);

    // joint picker for the plot
    const pickRow = document.createElement("div");
    pickRow.style.margin = "2px 0 8px";
    pickRow.style.color = "#4ED6A0";
    pickRow.appendChild(document.createTextNode("plot joint: "));
    const picker = document.createElement("select");
    joints.forEach((j, i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = j.userData.name;
      if (i === plotJoint.index) o.selected = true;
      picker.appendChild(o);
    });
    picker.addEventListener("change", () => (plotJoint.index = +picker.value));
    pickRow.appendChild(picker);
    panel.appendChild(pickRow);

    // PID gain sliders
    const gainWrap = document.createElement("div");
    gainWrap.style.cssText = "margin:4px 0 10px;padding:8px 0;border-top:1px solid rgba(231,236,243,0.12);border-bottom:1px solid rgba(231,236,243,0.12);";
    panel.appendChild(gainWrap);
    function gainSlider(name, key, min, max, step) {
      const row = document.createElement("div"); row.style.margin = "5px 0";
      const label = document.createElement("div"); label.style.color = "#4FB8FF";
      label.textContent = `${name}: ${PID[key]}`;
      const slider = document.createElement("input");
      slider.type = "range"; slider.min = min; slider.max = max; slider.step = step;
      slider.value = PID[key]; slider.style.width = "180px";
      slider.addEventListener("input", () => {
        PID[key] = +slider.value; label.textContent = `${name}: ${PID[key]}`;
        if (key === "ki") joints.forEach(j => j.userData.integ = 0);
      });
      row.appendChild(label); row.appendChild(slider); gainWrap.appendChild(row);
    }
    gainSlider("Kp", "kp", 0, 400, 1);
    gainSlider("Ki", "ki", 0, 200, 1);
    gainSlider("Kd", "kd", 0, 60, 0.5);

    // per-joint command sliders
    const jointUI = [];
    joints.forEach((joint) => {
      const spec = joint.userData;
      const row = document.createElement("div"); row.style.margin = "6px 0";
      const label = document.createElement("div");
      label.textContent = `${spec.name}: 0°`; label.style.color = "#FF8A3D";
      const slider = document.createElement("input");
      slider.type = "range"; slider.min = spec.min; slider.max = spec.max;
      slider.value = 0; slider.style.width = "180px";
      slider.addEventListener("input", () => {
        if (IK.enabled) return;
        const deg = +slider.value;
        spec.target = THREE.MathUtils.degToRad(deg);
        label.textContent = `${spec.name}: ${deg}° (cmd)`;
      });
      row.appendChild(label); row.appendChild(slider); panel.appendChild(row);
      jointUI.push({ slider, label, joint, spec });
    });

    function syncSliders() {
      jointUI.forEach(({ slider, label, joint, spec }) => {
        const deg = Math.round(THREE.MathUtils.radToDeg(joint.rotation[spec.axis]));
        slider.value = deg; label.textContent = `${spec.name}: ${deg}°`;
      });
    }

    // ---- READOUT ----
    const readout = document.createElement("div");
    readout.style.cssText =
      "position:fixed;bottom:12px;left:12px;padding:10px 14px;" +
      "background:rgba(22,27,36,0.9);border:1px solid rgba(231,236,243,0.16);" +
      "border-radius:10px;font-family:monospace;color:#4ED6A0;font-size:13px;z-index:10;";
    document.body.appendChild(readout);

    const tipPos = new THREE.Vector3(), tgtPos = new THREE.Vector3();
    function updateReadout() {
      endEffector.getWorldPosition(tipPos);
      target.getWorldPosition(tgtPos);
      const dist = tipPos.distanceTo(tgtPos);
      const reach = dist < 0.01 ? "reached" : (IK.enabled ? "out of reach" : "—");
      readout.textContent =
        `tip  x:${tipPos.x.toFixed(3)} y:${tipPos.y.toFixed(3)} z:${tipPos.z.toFixed(3)}   ` +
        `target dist:${dist.toFixed(3)}  ${reach}`;
    }

    // ---- LOOP ----
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const now = performance.now();
      _acc += Math.min((now - _last) / 1000, 0.05); _last = now;
      if (IK.enabled) solveIK();
      while (_acc >= PHYS_DT) { stepPhysics(PHYS_DT); pushSample(); _acc -= PHYS_DT; }
      if (IK.enabled) syncSliders();
      drawPlot();
      updateReadout();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
