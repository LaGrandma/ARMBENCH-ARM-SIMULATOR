<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ARMBENCH</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0D1017; }
    canvas { display: block; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0D1017);

    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.01, 100
    );
    camera.position.set(0.4, 0.4, 0.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.15, 0);

    scene.add(new THREE.GridHelper(1, 20, 0x4FB8FF, 0x222a35));
    scene.add(new THREE.AxesHelper(0.2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    const ARM = [
      { name: "base",     axis: "y", len: 0.06, min: -90,  max: 90  },
      { name: "shoulder", axis: "z", len: 0.10, min: -45,  max: 90  },
      { name: "elbow",    axis: "z", len: 0.09, min: -120, max: 120 },
      { name: "wrist",    axis: "z", len: 0.06, min: -90,  max: 90  },
      { name: "gripper",  axis: "y", len: 0.04, min: -90,  max: 90  },
    ];

    const joints = [];
    let parent = scene;
    let parentLen = 0;

    for (const spec of ARM) {
      const joint = new THREE.Group();
      joint.position.y = parentLen;
      parent.add(joint);

      const link = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, spec.len, 0.03),
        new THREE.MeshStandardMaterial({ color: 0xFF8A3D })
      );
      link.position.y = spec.len / 2;
      joint.add(link);

      joint.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.018),
        new THREE.MeshStandardMaterial({ color: 0x4FB8FF })
      ));

      joint.userData = spec;
      joints.push(joint);
      parent = joint;
      parentLen = spec.len;
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
